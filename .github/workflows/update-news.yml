
name: Update RSS News

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btcbrave-rss-updates
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Validate generator
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          else
            echo "Tests folder not present; skipping optional tests."
          fi

      - name: Build news.json
        env:
          RSS2JSON_API_KEY: ${{ secrets.RSS2JSON_API_KEY }}
        run: python build_news.py

      - name: Commit and push if changed
        shell: bash
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git add -- news.json

          if git diff --cached --quiet; then
            echo "news.json não mudou."
            exit 0
          fi

          git commit -m "Auto-update news.json"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

