<!DOCTYPE html>
<html lang="en">
<head>

<title>BTCBRAVE News | Crypto, Markets & World</title>

<style>
:root{--bg:#05060a;--card:#111318;--gold:#d4af37;--ink:#f5f5f5;--muted:#a0a4b8}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at top,#151827 0,#05060a 45%,#020308 100%);color:var(--ink);font-family:system-ui,Arial,sans-serif}
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:10px 22px;background:#05060af5;border-bottom:1px solid #252837;backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;letter-spacing:.05em;background:linear-gradient(90deg,#3b82f6,#8b5cf6,#ec4899,#f59e0b);color:transparent;background-clip:text}
.brand img{width:40px;height:40px;border:2px solid var(--gold);border-radius:50%;object-fit:cover}
.mail{display:block;margin-left:50px;font-size:12px;color:var(--muted);text-decoration:none}.bell{cursor:pointer;border:0;background:#fff;border-radius:50%;width:32px;height:32px;font-size:16px}
.filter-bar{max-width:1600px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;padding:10px 18px;position:sticky;top:var(--header-height,68px);z-index:29;background:#080b12ef;backdrop-filter:blur(14px);border-bottom:1px solid #252837;transition:transform .22s ease,opacity .22s ease}
.filter-bar.hidden-on-scroll{transform:translateY(-150%);opacity:0;pointer-events:none}
.filter-btn{background:#111318;color:var(--muted);border:1px solid #252837;border-radius:30px;padding:7px 14px;text-transform:uppercase;font-size:12px;letter-spacing:.05em;cursor:pointer}
.filter-btn:hover{border-color:var(--gold);color:#ffdd70}.filter-btn.active{background:linear-gradient(90deg,#3b82f6,#8b5cf6,#ec4899,#f97316);border-color:transparent;color:#fff}
.status{max-width:1600px;margin:8px auto;padding:0 18px;color:var(--muted);font-size:12px}
.grid{max-width:1600px;margin:0 auto;padding:12px 18px;column-count:4;column-gap:16px}
.card{width:100%;display:inline-block;break-inside:avoid;-webkit-column-break-inside:avoid;vertical-align:top;margin:0 0 16px;overflow:hidden;border:2px solid #ffffff30;border-radius:15px;background:radial-gradient(circle at top left,#202538,#111318 55%,#05060a);box-shadow:0 14px 32px #0009;cursor:pointer;transition:transform .18s,border-color .18s}
.card:hover{transform:translateY(-3px);border-color:#ffdd7088}.card:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.card-img{display:block;width:100%;height:190px;object-fit:cover;background:#0c1018}
.card:nth-child(9n + 1) .card-img{height:285px}.card:nth-child(9n + 4) .card-img,.card:nth-child(9n + 8) .card-img{height:240px}.card:nth-child(9n + 2) .card-img,.card:nth-child(9n + 6) .card-img{height:150px}
.card-body{padding:16px 18px}.card.no-image .card-body{padding-top:18px}.title{font-size:19px;font-weight:750;line-height:1.3;margin:0 0 8px}.desc{font-size:14px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}.meta{margin-top:12px;font-size:12px;color:var(--muted)}
.share-btn{position:absolute;top:10px;right:10px;border:1px solid #444;border-radius:9px;background:#111;color:#fff;padding:7px 11px;cursor:pointer}.card{position:relative}.card.no-image .share-btn{position:static;margin:12px 0 0 14px}
.more-wrap{text-align:center;padding:10px 0 36px}.more{border:0;border-radius:30px;background:var(--gold);color:#05060a;font-weight:750;padding:12px 24px;cursor:pointer}.empty{text-align:center;padding:28px;color:var(--muted)}
/* Continuous, editorial-style Blog reader: no Next Article button. */
.reader{display:none;max-width:1030px;margin:12px auto 34px;padding:12px 18px 24px;scroll-margin-top:calc(var(--header-height,68px) + 10px)}
.reader.open{display:block}
body.reader-mode .status,body.reader-mode #newsGrid,body.reader-mode #moreWrap,body.reader-mode #emptyState{display:none!important}
body.reader-mode .filter-bar{display:none!important}
.reader-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.reader-close{position:relative;top:auto;z-index:1;border:1px solid #d4af3770;border-radius:999px;background:#fff;color:#141923;font-size:14px;font-weight:750;padding:10px 17px;cursor:pointer;box-shadow:0 5px 15px #0006}
.reader-close:hover{background:#f5e4b7}
.reader-identity{font-size:12px;font-weight:800;letter-spacing:.15em;color:#e7d6a5}
.reader-inner{border:0;background:transparent;padding:0;box-shadow:none}
.reader-title{font-family:Georgia,'Times New Roman',serif;font-size:clamp(26px,4vw,42px);font-weight:800;margin:14px 0 22px;line-height:1.14}
.reader-body{display:flex;flex-direction:column;gap:30px;color:var(--ink);background:transparent;border-radius:0;padding:0;line-height:1.75;overflow-wrap:anywhere}
.reader-body img{max-width:100%;height:auto}
.reader-body a{overflow-wrap:anywhere}
.blog-story{width:100%;background:#fff;color:#191c25;border:1px solid #dadfe8;border-radius:17px;overflow:hidden;box-shadow:0 16px 36px #0006}
.blog-story__header{padding:32px 38px 0}
.blog-story__category{font-weight:800;color:#7c5c21;letter-spacing:.12em;font-size:12px;text-transform:uppercase}
.blog-story__title{font-family:Georgia,'Times New Roman',serif;font-size:clamp(27px,4vw,43px);font-weight:800;line-height:1.15;letter-spacing:-.02em;margin:12px 0 16px;color:#111827}
.blog-story__meta{display:flex;align-items:center;flex-wrap:wrap;gap:9px 14px;color:#687386;font-size:13px;padding-bottom:4px}
.blog-story__share{margin-left:auto;background:#111827;color:white;border:0;border-radius:999px;padding:8px 13px;font-weight:700;cursor:pointer}
.blog-story__share:hover{background:#3a475d}
.blog-story__hero{margin:22px 0 0;background:#101827;display:flex;align-items:center;justify-content:center}
.blog-story__hero img{width:100%;height:auto;max-height:620px;object-fit:contain;display:block}
.blog-story__content{max-width:860px;margin:0 auto;padding:29px 38px 32px;font-size:18px;line-height:1.85}
.blog-story__content p{margin:0 0 17px}
.blog-story__content p:last-child{margin-bottom:0}
.blog-story__content a{color:#2557a7;text-decoration:underline;text-underline-offset:3px}
.blog-story__content blockquote{border-left:3px solid #d4af37;margin:18px 0;padding:8px 20px;background:#f7f8fa;color:#334155}
.blog-story__content blockquote p{margin:0}
/* Prevent cutting the text inside automatically generated Blog covers on the cards. */
.card.blog-card .card-img{height:auto!important;aspect-ratio:16/9;object-fit:contain;background:#101827}
@media(max-width:620px){.reader{padding:8px 10px 20px}.reader-top{margin-bottom:12px}.reader-identity{font-size:10px}.reader-close{padding:9px 13px}.blog-story__header{padding:23px 21px 0}.blog-story__title{font-size:29px}.blog-story__content{font-size:17px;padding:23px 21px 27px}.reader-body{gap:30px}}
.overlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:100;padding:16px}.subscribe{position:relative;background:#fff;color:#111827;border-radius:12px;max-width:420px;width:100%;padding:28px;box-shadow:0 22px 50px #0009}.subscribe h2{margin:0 0 10px}.subscribe p{font-size:13px;line-height:1.5;color:#4b5563}.subscribe input[type=email]{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px}.subscribe button[type=submit]{width:100%;margin-top:12px;border:0;padding:12px;border-radius:30px;background:linear-gradient(90deg,#3b82f6,#8b5cf6,#ec4899,#f97316);color:white;font-weight:700;cursor:pointer}.close-sub{position:absolute;top:8px;right:12px;border:0;background:none;font-size:23px;cursor:pointer}
@media(max-width:1380px){.grid{column-count:3}}@media(max-width:960px){.grid{column-count:2}}@media(max-width:620px){header{padding:10px 12px}.brand{font-size:17px}.brand img{width:35px;height:35px}.mail{font-size:10px;margin-left:45px}.grid{column-count:1;padding:10px 12px}.filter-bar{padding:10px 12px;gap:6px}.filter-btn{padding:6px 11px}.reader{padding:10px}.reader-title{font-size:23px}}
</style>
</head>

<script>
'use strict';
const $=id=>document.getElementById(id);
const grid=$('newsGrid'),bar=$('filterBar'),reader=$('reader'),body=$('readerBody'),status=$('status');
const BLOG_URL='https://blog.btcbrave.store/posts.json';
const REFRESH_MS=10*60*1000,BATCH=60,BLOG_BATCH=5;
let news=[],blog=[],merged=[],visible=[],count=0,filter='all',busy=false,checked=0;
let readerBlog=false,blogOffset=0,readerPosts=[],scrollBefore=0,fingerprint='';
const str=v=>String(v??'');
function safeUrl(value){try{const s=str(value).trim();if(!s)return '';const u=new URL(s,location.href);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}
function parsed(value){const d=new Date(value);return Number.isFinite(+d)?d:new Date(0)}
function domain(url){try{return new URL(url).hostname.toLowerCase().replace(/^www\./,'')}catch{return ''}}
function source(url){const h=domain(url),names={
 'cointelegraph.com':'Cointelegraph','cryptonews.com':'CryptoNews','coindesk.com':'CoinDesk','decrypt.co':'Decrypt',
 'finance.yahoo.com':'Yahoo Finance','yahoo.com':'Yahoo Finance','investors.com':'Investors.com',
 'wsj.com':'WSJ','investing.com':'Investing.com','marketwatch.com':'MarketWatch',
 'bloomberg.com':'Bloomberg','cnbc.com':'CNBC','forbes.com':'Forbes',
 'bbc.co.uk':'BBC News','bbc.com':'BBC News','cnn.com':'CNN','reuters.com':'Reuters',
 'aljazeera.com':'Al Jazeera','msn.com':'MSN News','apnews.com':'AP News',
 'nytimes.com':'The New York Times','washingtonpost.com':'The Washington Post',
 'gamespot.com':'GameSpot','polygon.com':'Polygon','allrecipes.com':'Allrecipes',
 'thespruceeats.com':'The Spruce Eats','bonappetit.com':'Bon Appétit','serious eats.com':'Serious Eats','seriouseats.com':'Serious Eats','theguardian.com':'The Guardian','npr.org':'NPR','theverge.com':'The Verge','techcrunch.com':'TechCrunch','arstechnica.com':'Ars Technica','wired.com':'WIRED','engadget.com':'Engadget','technologyreview.com':'MIT Technology Review','cnet.com':'CNET'};
 const key=Object.keys(names).find(k=>h===k||h.endsWith('.'+k));return key?names[key]:h.toUpperCase()||'NEWS'}
function category(url){const s=source(url);if(['Cointelegraph','CryptoNews','CoinDesk','Decrypt'].includes(s))return 'crypto';
 if(['Yahoo Finance','Investors.com','WSJ','Investing.com','MarketWatch','Bloomberg','CNBC','Forbes'].includes(s))return 'finance';
 if(['GameSpot','Polygon'].includes(s))return 'games';if(['Allrecipes','The Spruce Eats','Bon Appétit','Serious Eats'].includes(s))return 'food';if(['BBC News','CNN','Reuters','Al Jazeera','MSN News','AP News','The New York Times','The Washington Post'].includes(s))return 'world';return 'all'}
function slug(t){return str(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,72)||'article'}
function hash(t){let n=2166136261;for(const ch of str(t)){n^=ch.charCodeAt(0);n=Math.imul(n,16777619)}return(n>>>0).toString(36)}
function normalize(items,isBlog){return items.map((p,i)=>({...p,isBlog,category:isBlog?(p.category||'blog'):(p.category||category(p.link)),_slug:slug(p.slug||p.title)+'-'+hash(p.link||p.title||i)}))
 .filter(p=>parsed(p.pubDate)<=new Date()).sort((a,b)=>parsed(b.pubDate)-parsed(a.pubDate))}
function combine(){const n=normalize(news,false),b=normalize(blog,true);window.blogPosts=b;merged=[];
 for(let i=0,j=0;i<n.length||j<b.length;){if(j<b.length)merged.push({...b[j],blogIndex:j++});if(i<n.length)merged.push(n[i++])}setFilter(filter)}
function imageFor(url,title){const src=safeUrl(url);if(!src)return null;const img=document.createElement('img');img.className='card-img';img.src=src;img.alt=str(title);img.loading='lazy';img.decoding='async';img.onerror=()=>{const card=img.closest('.card');img.remove();card?.classList.add('no-image')};return img}
function cardFor(p){const card=document.createElement('article');card.className=p.isBlog?'card blog-card':'card';card.tabIndex=0;card.role='link';card.setAttribute('aria-label',str(p.title));card.dataset.slug=p._slug;
 const img=imageFor(p.thumbnail,p.title);if(img)card.append(img);else card.classList.add('no-image');
 if(p.isBlog){const share=document.createElement('button');share.className='share-btn';share.textContent='↗ Share';share.onclick=e=>{e.stopPropagation();sharePost(p)};card.append(share)}
 const content=document.createElement('div');content.className='card-body';
 const title=document.createElement('h2');title.className='title';title.textContent=str(p.title);
 const desc=document.createElement('div');desc.className='desc';const t=str(p.description);desc.textContent=t.length>120?t.slice(0,120)+'…':t;
 const meta=document.createElement('div');meta.className='meta';const d=parsed(p.pubDate);meta.textContent=(+d?d.toLocaleDateString():'')+' • '+(p.isBlog?'BTCBRAVE Blog':source(p.link));
 content.append(title,desc,meta);card.append(content);card.onclick=()=>openArticle(p);card.onkeydown=e=>{if(e.key==='Enter'&&e.target===card){e.preventDefault();openArticle(p)}};return card}
function addBatch(){if(count>=visible.length){$('moreWrap').hidden=true;return}const frag=document.createDocumentFragment(),end=Math.min(count+BATCH,visible.length);
 while(count<end)frag.append(cardFor(visible[count++]));grid.append(frag);$('moreWrap').hidden=count>=visible.length}
function setFilter(name){filter=name;visible=merged.filter(p=>name==='all'||(name==='blog'?p.isBlog:str(p.category).toLowerCase()===name));grid.replaceChildren();count=0;$('emptyState').hidden=visible.length>0;addBatch()}
bar.onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;bar.querySelectorAll('.filter-btn').forEach(x=>x.classList.toggle('active',x===b));setFilter(b.dataset.filter)};
$('moreBtn').onclick=addBatch;
if('IntersectionObserver'in window)new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting)&&!reader.classList.contains('open'))addBatch()},{rootMargin:'400px'}).observe($('moreWrap'));
const allowed=new Set('p div span br strong b em i u h2 h3 h4 h5 ul ol li blockquote a img pre code hr'.split(' '));
const forbidden=new Set('script style svg math iframe object embed form input button textarea select link meta base'.split(' '));
function safeAppend(parent,node){if(node.nodeType===Node.TEXT_NODE){parent.append(document.createTextNode(node.textContent));return}if(node.nodeType!==Node.ELEMENT_NODE)return;
 const tag=node.tagName.toLowerCase();if(forbidden.has(tag))return;if(!allowed.has(tag)){[...node.childNodes].forEach(n=>safeAppend(parent,n));return}
 const out=document.createElement(tag);if(tag==='a'){const u=safeUrl(node.getAttribute('href'));if(u){out.href=u;out.target='_blank';out.rel='noopener noreferrer'}}
 if(tag==='img'){const u=safeUrl(node.getAttribute('src'));if(!u)return;out.src=u;out.alt=node.getAttribute('alt')||'';out.loading='lazy'}
 [...node.childNodes].forEach(n=>safeAppend(out,n));parent.append(out)}
function safeHtml(el,html){const doc=new DOMParser().parseFromString('<div>'+str(html)+'</div>','text/html');[...doc.body.firstElementChild.childNodes].forEach(n=>safeAppend(el,n))}
function blogBatch(reset=false){
 if(reset){body.replaceChildren();blogOffset=0}
 if(!readerBlog||blogOffset>=readerPosts.length)return;
 const fragment=document.createDocumentFragment();
 const until=Math.min(blogOffset+BLOG_BATCH,readerPosts.length);
 for(let i=blogOffset;i<until;i++){
  const p=readerPosts[i];
  const article=document.createElement('article');article.className='blog-story';
  const head=document.createElement('div');head.className='blog-story__header';
  const categoryLabel=document.createElement('div');categoryLabel.className='blog-story__category';
  categoryLabel.textContent='BTCBRAVE BLOG · '+str(p.category||'News').toUpperCase();
  const h=document.createElement('h2');h.className='blog-story__title';h.textContent=str(p.title);
  const meta=document.createElement('div');meta.className='blog-story__meta';
  const date=document.createElement('span');const parsedDate=parsed(p.pubDate);
  date.textContent=+parsedDate?parsedDate.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):'BTCBRAVE Blog';
  const sourceName=document.createElement('span');
  sourceName.textContent='Source: '+str(p.source||(safeUrl(p.sourceLink)?source(p.sourceLink):'BTCBRAVE Blog'));
  const share=document.createElement('button');share.type='button';share.className='blog-story__share';
  share.textContent='↗ Share';share.setAttribute('aria-label','Share '+str(p.title));
  share.onclick=()=>sharePost(p);
  meta.append(date,sourceName,share);head.append(categoryLabel,h,meta);article.append(head);
  const url=safeUrl(p.thumbnail);
  if(url){
   const figure=document.createElement('figure');figure.className='blog-story__hero';
   const image=document.createElement('img');image.src=url;image.alt='Illustration: '+str(p.title);
   image.loading=i===0?'eager':'lazy';image.decoding='async';
   image.onerror=()=>figure.remove();figure.append(image);article.append(figure);
  }
  const content=document.createElement('div');content.className='blog-story__content';
  safeHtml(content,p.fullText||p.description||'');article.append(content);
  fragment.append(article);
 }
 body.append(fragment);blogOffset=until;
}
function openArticle(p){
 scrollBefore=window.scrollY;
 if(!p.isBlog&&!p.fullText&&safeUrl(p.link)){location.href=safeUrl(p.link);return}
 readerBlog=!!p.isBlog;
 $('readerImage').replaceChildren();$('readerTitle').textContent=readerBlog?'':str(p.title);
 body.replaceChildren();
 if(readerBlog){
  readerPosts=(window.blogPosts||[]).slice(p.blogIndex||0);
  blogBatch(true);
 }else{
  readerPosts=[];
  const u=safeUrl(p.thumbnail);
  if(u){const img=document.createElement('img');img.src=u;img.alt=str(p.title);img.style.cssText='width:100%;max-height:500px;object-fit:contain';$('readerImage').append(img)}
  safeHtml(body,p.fullText||p.description||'');
 }
 document.body.classList.add('reader-mode');
 reader.classList.add('open');
 reader.scrollIntoView({behavior:'auto',block:'start'});
}
$('readerClose').onclick=()=>{
 reader.classList.remove('open');document.body.classList.remove('reader-mode');
 readerBlog=false;readerPosts=[];body.replaceChildren();
 window.scrollTo({top:scrollBefore,behavior:'auto'});
};
function sharePost(p){const url=safeUrl(p.link)||'https://news.btcbrave.store/?post='+encodeURIComponent(p._slug);const text='Check this article on BTCBRAVE News: '+p.title;
 if(navigator.share){navigator.share({title:p.title,text,url}).catch(()=>{});return}if(/Android|iPhone|iPad/i.test(navigator.userAgent)){window.open('https://wa.me/?text='+encodeURIComponent(text+' '+url),'_blank');return}prompt('Copy this link:',url)}
window.addEventListener('scroll',()=>{if(readerBlog&&reader.classList.contains('open')&&blogOffset<readerPosts.length&&body.getBoundingClientRect().bottom-innerHeight<550)blogBatch()},{passive:true});
// Barra reaparece quando se sobe um pouco e some ao descer.
let previousY=scrollY,up=0,down=0;
function stickyBar(){document.documentElement.style.setProperty('--header-height',$('header').offsetHeight+'px');const y=scrollY,delta=y-previousY;
 if(y<120){bar.classList.remove('hidden-on-scroll');up=down=0}
 else if(delta<0){up+=-delta;down=0;if(up>5){bar.classList.remove('hidden-on-scroll');up=0}}
 else if(delta>0){down+=delta;up=0;if(down>18){bar.classList.add('hidden-on-scroll');down=0}}previousY=y}
window.addEventListener('scroll',stickyBar,{passive:true});window.addEventListener('resize',stickyBar);stickyBar();
async function getJSON(url){const r=await fetch(url+(url.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const obj=await r.json();if(!Array.isArray(obj))throw Error('Expected array');return obj}
async function refresh(){if(busy)return;busy=true;try{const results=await Promise.allSettled([getJSON('news.json'),getJSON(BLOG_URL)]);
 const a=results[0].status==='fulfilled',b=results[1].status==='fulfilled';if(a)news=results[0].value;if(b)blog=results[1].value;
 const sig=JSON.stringify([news,blog]);if(sig!==fingerprint){fingerprint=sig;combine()}
 status.textContent=(!a&&!b?'Unable to refresh; showing earlier news.':!a||!b?'Some sources unavailable. Last checked: ':'Last checked: ')+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
 checked=Date.now();const target=new URLSearchParams(location.search).get('post');if(target&&!window._openedPost){const i=merged.findIndex(p=>p._slug===target);if(i!==-1){window._openedPost=true;bar.querySelector('[data-filter="all"]').click();while(count<=i&&count<visible.length)addBatch();grid.querySelectorAll('.card')[i]?.click()}}}
 catch(e){console.error(e);status.textContent='Unable to load news; please try again.'}finally{busy=false}}
refresh();setInterval(refresh,REFRESH_MS);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-checked>REFRESH_MS/2)refresh()});
// Inscrição Brevo — não promete remover ou confirmar uma inscrição sem resposta do serviço.
const overlay=$('subscribeOverlay');function showSubscribe(){overlay.style.display='flex'}function closeSubscribe(){overlay.style.display='none'}
$('subscribeBell').onclick=showSubscribe;$('closeSubscribe').onclick=closeSubscribe;overlay.onclick=e=>{if(e.target===overlay)closeSubscribe()};
const prev=Number(localStorage.getItem('btcbraveSubscribeRequestAt')||0);
if(!localStorage.getItem('btcbraveSubscribed')&&(!prev||Date.now()-prev>30*86400000))setTimeout(showSubscribe,1500);
let submitted=false;$('subscribeForm').onsubmit=e=>{const inp=$('email');if(!inp.validity.valid){e.preventDefault();inp.reportValidity();return}localStorage.setItem('btcbraveSubscribeRequestAt',String(Date.now()));submitted=true};
document.querySelector('[name="hiddenBrevoFrame"]').addEventListener('load',()=>{if(submitted){submitted=false;alert('Request sent. Please check your inbox for confirmation.');closeSubscribe()}});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').catch(console.error));
